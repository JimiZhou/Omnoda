openapi: 3.0.3
info:
  title: Omnoda Control Plane API
  version: 0.3.0
paths:
  /api/v1/auth/login:
    post:
      summary: Create a browser session
  /api/v1/auth/logout:
    post:
      summary: End the browser session
  /api/v1/auth/me:
    get:
      summary: Current session
  /api/v1/nodes:
    get:
      summary: List enrolled nodes
  /api/v1/nodes/{id}:
    get:
      summary: Node detail
    delete:
      summary: Revoke a node
  /api/v1/nodes/{id}/capabilities:
    get:
      summary: Capabilities and harnesses
  /api/v1/nodes/enrollment-codes:
    post:
      summary: Create a one-time enrollment code
  /api/v1/tasks:
    post:
      summary: Dispatch a task to an online node
    get:
      summary: List tasks
  /api/v1/tasks/{id}:
    get:
      summary: Task status
  /api/v1/tasks/{id}/cancel:
    post:
      summary: Cancel a task
  /api/v1/workflows:
    post:
      summary: Plan and start a workflow
    get:
      summary: List workflows
  /api/v1/workflows/{id}:
    get:
      summary: Workflow, steps, and report
  /api/v1/workflows/{id}/cancel:
    post:
      summary: Cancel a workflow
  /api/v1/approvals/{id}/approve:
    post:
      summary: Approve one bound action
  /api/v1/approvals/{id}/reject:
    post:
      summary: Reject one bound action
  /api/v1/artifacts/{id}:
    get:
      summary: Artifact metadata
  /api/v1/audit:
    get:
      summary: Audit log
  /api/v1/seed/bootstrap:
    get:
      summary: Seed runtime descriptor. Loopback process, no remote control plane.
  /api/v1/capabilities:
    get:
      summary: List capability records. Requires a session.
  /api/v1/capabilities/{id}:
    get:
      summary: One capability, including manifest and verification status.
  /api/v1/capabilities/import:
    post:
      summary: Import a bundle. Installed, not enabled.
  /api/v1/capabilities/{id}/test:
    post:
      summary: Invoke an enabled capability. Untrusted code requires a sandbox backend.
  /api/v1/capabilities/{id}/activate:
    post:
      summary: Enable one verified version. Disables other versions of the same id.
  /api/v1/capabilities/{id}/disable:
    post:
      summary: Disable a capability.
  /api/v1/capabilities/{id}/export:
    post:
      summary: Write a bundle that excludes secrets and the device key.
  /api/v1/evolutions:
    post:
      summary: Start a bounded evolution. Fails closed when no model is configured.
    get:
      summary: List evolutions.
  /api/v1/evolutions/{id}:
    get:
      summary: Evolution record and evidence.
  /api/v1/evolutions/{id}/approve:
    post:
      summary: Enable the verified candidate. Refused from any other state.
  /api/v1/evolutions/{id}/reject:
    post:
      summary: Reject a candidate waiting for approval.
  /api/v1/agent/run:
    post:
      summary: One native agent turn. Requires a configured model. Does not invent a reply. Uses the capability host, including request_capability.
  /api/v1/conversations:
    post:
      summary: Create a persistent conversation for the signed-in user.
    get:
      summary: List the signed-in user's conversations.
  /api/v1/conversations/{id}:
    get:
      summary: Conversation and ordered messages.
  /api/v1/conversations/{id}/messages:
    post:
      summary: Append a user message and start a durable task. Idempotency key returns the existing task.
  /api/v1/tasks/{id}/events:
    get:
      summary: Task events. Query after returns events with a greater sequence.
  /api/v1/tasks/{id}/runs:
    get:
      summary: Execution records for a task. A new run is labeled when the original process cannot be resumed.
  /api/v1/node/ws:
    get:
      summary: Node websocket. Requires enrollment or a known device key. Not a public RPC endpoint.
