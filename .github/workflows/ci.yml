name: ci
on:
  push:
    branches: ["**"]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: gofmt -l . | tee /tmp/gofmt.out && ! [ -s /tmp/gofmt.out ]
      - run: go vet ./...
      # This job does not require bubblewrap. Sandbox-dependent tests skip.
      # Fail-closed behavior still runs wherever no backend is present.
      - run: go test ./...
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: prove isolation or mark blocked
        run: |
          set -euo pipefail
          # Same namespace set as internal/sandbox: --unshare-all, no --share-net.
          # A probe that keeps the host network would not prove the product policy.
          # ubuntu-latest currently fails with "loopback: Failed RTM_NEWADDR:
          # Operation not permitted". That result is BLOCKED, not a pass.
          if bwrap --unshare-all --die-with-parent --new-session --proc /proc --dev /dev --tmpfs /tmp --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 -- /usr/bin/python3 -c 'print("probe")'; then
            echo "SANDBOX=PASS" | tee -a "$GITHUB_STEP_SUMMARY"
            go test ./internal/evolver/ ./internal/sandbox/ -count=1
          else
            {
              echo "## SANDBOX=BLOCKED"
              echo "GitHub-hosted ubuntu-latest cannot create the bubblewrap network namespace used by the product sandbox."
              echo "Observed failure: loopback RTM_NEWADDR: Operation not permitted."
              echo "Untrusted packages fail closed in the go job. This job is not a pass."
              echo "Real isolation was run on a Linux amd64 host with bubblewrap 0.11.1. Repeat with: go test ./internal/evolver/ ./internal/sandbox/ -count=1"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error title=SANDBOX BLOCKED::bubblewrap --unshare-all cannot configure loopback on this hosted runner"
            exit 1
          fi
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web
  cross:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o /tmp/omnoda ./cmd/omnoda
